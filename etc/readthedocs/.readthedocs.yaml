version: 2

python:
  install:
    - method: uv
      command: pip
      requirements: etc/readthedocs/requirements.txt

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
  jobs:
    build:
      html:
        - ssg build
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -R site/. "$READTHEDOCS_OUTPUT/html/"
